# ------------------------------------------------------------- reactions
# What happens when a hit leaves an element's tag on an enemy that already
# holds the tag of the other element of a pair. The reaction ends both tags
# and whatever they were still going to do (a burn stops, a surge never comes).
# A pair has one reaction at most; they are tried in id order.
#
# `kind` is code in core/src/elements.rs:
#   burst   every enemy within `reach` of the struck one takes `power` times
#           the hit's damage.
#   relay   the surge waiting on the enemy goes off at once at `power` times
#           its size, and the same again on the `count` nearest enemies
#           within `reach`.
# `color` is the colour of the ring it draws.

[[reaction]]
id = 0
name = "blast"
a = "fire"
b = "lightning"
kind = "burst"
power = 1.5
reach = 110
color = [0.90, 0.50, 0.16]

[[reaction]]
id = 1
name = "conduct"
a = "water"
b = "lightning"
kind = "relay"
power = 1.5
count = 3
reach = 150
color = [0.42, 0.52, 0.86]

[[reaction]]
id = 2
name = "steam"
a = "water"
b = "fire"
kind = "burst"
power = 0.9
reach = 160
color = [0.80, 0.80, 0.78]

