# Routes (套路, the [[route]] entries above): 1 on, 0 off. Off, every art
# grows by its own numbers up to its top level as before routes existed.
[[tune]]
id = 50
name = "routes"
mission = "any"
default = 1
min = 0
max = 1
step = 1

