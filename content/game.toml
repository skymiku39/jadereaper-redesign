# ------------------------------------------------------------------ arts
# Martial arts (武學): how the player attacks. Each has one `behaviour`, which
# is code in core/src/arts.rs, and the numbers below. A new art of an existing
# behaviour is a new [[upgrade]] (its card, glyph and top level) and an
# [[art]] of the same name, with its text in src/i18n.js.
#
# Ids index a table, so they run 0, 1, 2... without gaps; arts act in id order.
# `part` is the part drawn for the swing, shot, bead or ring. `start_level` is
# the level held when a run starts (left out: not held). `first_delay` is the
# wait before the first use.
#
# These keys take one number, or a list with one number per level:
#   damage     per hit, before the might passive
#   cooldown   seconds between uses, before the haste passive
#              (orbit: seconds before the same enemy can be hit again)
#   count      arc: slash marks drawn; projectile: shots; orbit: beads
#   reach      arc and nova: radius; orbit: distance from the player
#   width      arc only: an enemy is hit when the cosine of the angle between
#              the aim and the enemy is above this; -2 hits all round
#   pierce     projectile only: enemies one shot can hit
#   knockback  speed the enemy is pushed away at
#              (projectile: a share of the shot's speed instead)
# `speed`, `life` and `range` are the same at every level: a projectile's
# speed, its seconds of flight and how near an enemy must be to be shot at;
# for orbit, `speed` is the turn rate in radians per second.

[[art]]
id = 0
name = "scythe"
behaviour = "arc"
part = "slash"
start_level = 1
first_delay = 0.6
damage = [20, 26, 32, 38, 44, 50]
cooldown = 0.9
count = [1, 1, 1, 1, 2, 2]
reach = [119, 133, 147, 161, 175, 189]
width = [-0.15, -0.15, -0.15, -0.15, -2, -2]
knockback = 240

