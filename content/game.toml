# Jade Reaper content: the single source of the ids shared by the Rust core,
# the JavaScript host and the shader.
#
# After editing, run ./build.sh (or only the generator:
#   cargo run --release --manifest-path tools/gen/Cargo.toml)
# and commit the generated files with this one:
#   core/src/generated.rs, src/generated.js and the block in src/shader.wgsl.
#
# Format: a small subset of TOML. Top-level `key = value` lines, then
# `[[table]]` entries with `key = value` lines. Values are integers, decimals,
# "strings", true/false, or [arrays of numbers]. `#` starts a comment.
# Names are lowercase snake_case; the generator derives the constant names
# from them (part `player_body` becomes `P_PLAYER_BODY` in Rust,
# `PART_PLAYER_BODY` in the shader and stays `player_body` in JavaScript).

# Ink colour (linear-ish RGB, 0..1) used by the core and the shader.
ink = [0.17, 0.15, 0.13]

# Size of the HUD state buffer in floats.
state_floats = 80

# How many martial arts the player can hold at once. An art not yet held is
# not offered once this many are.
max_arts = 6

