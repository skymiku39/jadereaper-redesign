# ---------------------------------------------------------------- moves
# Moves (式) of the routes above. A route's moves have ids that follow each
# other and are used in that order. Lengths are shares of the art's level-2
# numbers (`reach = 1` is its reach then), and `power` a share of its damage
# then. Every key but `route` and `shape` may be left out and is then 0.
#   arc    sweeps around the player: `width` is a cosine bound like an art's
#          (-2 all round); `count` sweeps, `spread` turns apart, `delay`
#          seconds apart, each later one reaching `grow` further
#   wave   `count` blade waves along the aim, fanned over `spread` turns,
#          each hitting `pierce` enemies, at `speed` for `life` seconds
#   marks  `count` marks ahead, `spread` reaches apart, each a circle of
#          `reach` that strikes `delay` seconds later
#   ring   `count` rings of `reach`, `delay` seconds apart, each later one
#          reaching `grow` further, centred `offset` reaches ahead
# A wave with `seek = 1` aims at the nearest enemy; with `delay` its waves
# fly one after another down one line instead of in a fan; `split` small
# waves burst from where each one's flight ends; `grow` adds that share of
# damage with each enemy it passes through. A `spread` of 1 or more sets the
# waves evenly all round.
# `stop` asks the host for a moment of hit-stop when the move is used.
# Text is `move.<name>.name` and `.desc` (the card's line) in src/i18n.js.

