# -------------------------------------------------------------- weapons
# Weapon kinds (兵器種類, docs/design.md 4.8.2): with the `routes` tune on, an
# art's weapon is one of its kinds, which the weapons deck draws; a held art
# can change to another kind and keep its level and route. Ids index a table
# (at most 32). Each art with kinds has exactly one `start` kind, the one it
# comes in when first taken. The form tags change its numbers (core/src/kinds.rs):
#   long       reach 15% further, a beat 10% slower
#   short      reach 10% less, a beat 10% quicker
#   heavy      10% more damage, 30% more knockback, a beat 10% slower
#   light      a beat 10% quicker
#   paired     20% more damage (two blades)
#   mechanism  learns only the routes limited to it (`only` on [[route]])
# A `trait` is what the kind does of its own: `hook` pulls in the last enemy a
# sweep hits, `pierce` lets shots pass one enemy more, `swarm` throws twice the
# shots at half the damage, `tip` sweeps round the tip of a thrust, `bend`
# whips on from the tip of a thrust to the nearest enemy there.
# `famous` is what the kind's famous blade (名器, docs/martial-arts.md) does of
# its own while the art's weapon is famous: `reach` sweeps 10% further with a
# jade blade light (玉鐮), `stop` the first move of each round of the route
# stops the game for a beat (斷雲), `knock` throws enemies 30% further back
# (烏金棍), `speed` shots fly 25% faster (柳葉飛刀), `turret` one more mechanism
# is set down and may stand (the Tang box), `guard` every move adds 1 guard
# without the metal element (玄鐵護手). Left out, a famous blade of the kind is
# only its quality and needs no buying; a named one only comes once it is
# bought at the weapon shop (the `famous_owned` tune).
# Names are `weapon.<name>` in src/i18n.js; a famous blade's are
# `famous.<name>.name` and `famous.<name>.desc`.

