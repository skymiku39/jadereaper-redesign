# -------------------------------------------------------------- passives
# What each passive upgrade does: one `stat`, changed by `amount` per level of
# the [[upgrade]] of the same name. How the levels add up depends on the stat:
#   max_hp        `amount` more health, and as much healed, each time it is picked
#   move_speed    walking speed times 1 + amount x level
#   pickup_range  the range gems are pulled from, times 1 + amount x level
#   damage        every martial art's damage times 1 + amount x level
#   cooldown      every martial art's cooldown times amount ^ level
#   regen         `amount` x level health back per second
# Every upgrade is either an [[art]] or a passive. The six here are the
# prototype's and are to be redesigned (docs/design.md, section 4.5).

[[passive]]
name = "vitality"
stat = "max_hp"
amount = 20

[[passive]]
name = "swift"
stat = "move_speed"
amount = 0.08

[[passive]]
name = "lure"
stat = "pickup_range"
amount = 0.3

[[passive]]
name = "might"
stat = "damage"
amount = 0.12

[[passive]]
name = "haste"
stat = "cooldown"
amount = 0.92

[[passive]]
name = "mending"
stat = "regen"
amount = 0.4

# With the `routes` tune on, the passives are inner arts (心法) of three
# layers (core/src/inner.rs, docs/design.md 4.8.4): the first layer does what
# is written above, once; the second and third change a rule. These three
# exist only then:
#   splash   a share of a blow, per layer, passes to the enemies within reach
#            of one that a hit throws back (四兩撥千斤)
#   reach    melee moves reach this much further; from layer 2 the last move
#            of a melee route also sends a blade of qi (氣貫長虹)
#   element  hits that carry an element land this much harder; from layer 2
#            reactions too (萬法歸一功)

[[passive]]
