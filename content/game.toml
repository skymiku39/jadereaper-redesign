# ------------------------------------------------------------- missions
# What a run is for. Ids index the mission tables, so they run 0, 1, 2...
# without gaps. `goal` is what the mission asks for, in its own unit; 0 means
# the mission has no goal and only ends on death. The rule that checks the
# goal is `Game::mission_won` in core/src/game.rs. Names and descriptions are
# `mission.<name>.name` and `.desc` in src/i18n.js.

[[mission]]
id = 0
name = "endless"
goal = 0

# Stay alive for `goal` seconds.
[[mission]]
id = 1
name = "survive"
goal = 300

# Cut down `goal` enemies. There is no time limit.
[[mission]]
id = 2
name = "kills"
goal = 1500

# Destroy `goal` formation nodes. Each keeps spawning enemies until it falls.
[[mission]]
id = 3
name = "formation"
goal = 5

# Clear `goal` waves, one at a time. The next wave only comes once the current
# one is dead. The waves are in core/src/mission_arena.rs.
[[mission]]
id = 4
name = "arena"
goal = 10

# Fetch `goal` relics from far-off spots and bring each back to the start.
# Carrying slows the player. A relic counts once it is delivered.
[[mission]]
id = 5
name = "retrieval"
goal = 3

# Catch and kill a target before it reaches its exit. goal is the target's
# health, so progress is the damage dealt. Lost on death or when it escapes.
# The rules are in core/src/mission_pursuit.rs.
[[mission]]
id = 6
name = "pursuit"
goal = 3000

# Walk a villager to a far shrine. `goal` is the route length in world units
# (ESCORT_LEGS x ESCORT_LEG_LEN in core/src/mission_escort.rs). The run is
# lost when the villager falls.
[[mission]]
id = 7
name = "escort"
goal = 21000

# Stand inside the circle round the shrine for `goal` seconds while the horde
# wears the shrine down. The run is also lost when the shrine falls. The rules
# live in core/src/mission_hold.rs.
[[mission]]
id = 8
name = "hold"
goal = 300

# Reach the exit, `goal` world units from the start, while surrounded. The
# rules are in core/src/mission_escape.rs.
[[mission]]
id = 9
name = "escape"
goal = 18000

# Defeat the boss. `goal` is its health. The rules and numbers are in
# core/src/mission_boss.rs.
[[mission]]
id = 10
name = "boss"
goal = 12000

# Travel to a marked place and kill the goal marked enemies that wait there.
# The count is the number of marked enemies; progress is how many are dead.
[[mission]]
id = 11
name = "vendetta"
goal = 6

