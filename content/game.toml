amount = 0.15

[[passive]]
name = "qiguan"
stat = "reach"
amount = 0.1

[[passive]]
name = "wanfa"
stat = "element"
amount = 0.15

# --------------------------------------------------------------- enemies
# Enemy kinds. Ids index a table, so they run 0, 1, 2... without gaps.
# `radius` is what it collides with, `half_width` and `half_height` how large
# its part is drawn, `pose_rate` how many times a second its puppet changes
# pose, `xp` the worth of the gem it drops. Flags, each false when left out:
# `corpse` (a corpse or a spirit, which the holy element hits hardest),
# `heavy` (hard to push, bursts into more pieces), `hover` (drawn floating).
#
# How it joins the horde of the missions that have one:
#   from    seconds into the run before the horde sends it
#   share   its share of the horde's spawns from then on
#   ramp    above 0, the share grows from nothing to `share` over this many
#           seconds after `from`
#   tune    the name of a tune that holds its share instead of `share`
#   every   above 0, one comes every this many seconds with an announcement,
