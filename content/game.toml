# --------------------------------------------------------------- routes
# Routes (套路, docs/design.md 4.8.3): with the `routes` tune on, an art that
# reaches level 3 takes one of the routes that name it, and from then on uses
# that route's moves in turn, one every `beat` seconds (before the haste
# passive), instead of its own numbers. Levels 1 and 2 stay the art's basic
# move. Its top level becomes 2 + the route's moves, the last of which may be
# the ultimate (絕招). `start` marks a route known from the start; the others
# are stolen (偷師) and are not offered yet. `zenith` names the inner art its
# ultimate needs, with the route whole and an element on the art, to reach its
