# -------------------------------------------------------------- elements
# Magic elements (魔法): what a martial art adds to its hits once the element's
# card is put on it. An art carries one element at most; a new card replaces
# the old one. Ids run from 1 (0 means no element). `glyph` is the mark on
# cards and HUD chips, `color` tints the art and the tag on enemies. Text is
# element.<name>.name and .desc in src/i18n.js.
#
# `effect` is code in core/src/elements.rs; the numbers mean, per effect:
#   guard   acts on the player: each hit adds `power` guard, up to `cap`.
#           Guard takes the share `minor` of a blow (as far as it lasts) and
#           health takes the rest. After `time` seconds without a hit it
#           fades by `rate` per second.
#   regrow  acts on the player: a hit starts `time` seconds of healing
#           `power` health per second. More hits only restart the time.
#   surge   `time` seconds after the hit, the enemy takes `power` times the
#           hit's damage. A second hit before then keeps the larger amount.
#   burn    for `time` seconds the enemy takes `power` times the hit's damage
#           per second, in ticks `rate` seconds apart. A new hit restarts the
#           time and does not add up.
#   root    the enemy is pushed away at `power` and cannot move for `time`
#           seconds. It cannot be rooted again for `rest` seconds after that.
#   chain   `power` times the hit's damage jumps to the `count` nearest
#           enemies within `reach`. The tag lasts `time` seconds.
#   bane    the hit does `power` times more damage to corpse enemies and
#           `minor` times more to the others. The tag lasts `time` seconds.
# guard and regrow leave no tag on the enemy, so they take no part in reactions.
# Every number is a first pick, to be settled by playing.

[[element]]
id = 1
name = "metal"
glyph = "金"
color = [0.80, 0.70, 0.36]
effect = "guard"
power = 1
cap = 12
minor = 0.4
time = 2.0
rate = 6

[[element]]
id = 2
name = "wood"
glyph = "木"
color = [0.36, 0.62, 0.30]
effect = "regrow"
power = 1.5
time = 3.0

[[element]]
id = 3
name = "water"
glyph = "水"
color = [0.25, 0.48, 0.70]
effect = "surge"
power = 1.0
time = 0.8

[[element]]
id = 4
name = "fire"
glyph = "火"
color = [0.82, 0.34, 0.18]
effect = "burn"
power = 0.8
time = 3.0
rate = 0.5

[[element]]
id = 5
name = "earth"
glyph = "土"
color = [0.55, 0.42, 0.26]
effect = "root"
power = 260
time = 0.6
rest = 2.0

[[element]]
